<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAOW · اشتراک</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root{--bg:#050505;--bg-elevated:#0c0c0e;--bg-card:#111113;--border:rgba(255,255,255,.06);--border-hover:rgba(255,255,255,.12);--text:#f4f4f5;--text-secondary:#a1a1aa;--text-muted:#71717a;--accent:#7dd3fc;--accent-dim:rgba(125,211,252,.12);--success:#4ade80;--warning:#fbbf24;--danger:#f87171;--radius:12px;--radius-lg:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;padding:28px 16px 48px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand-mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff}
.brand-name{font-size:18px;font-weight:600}
.brand-sub{font-size:12px;color:var(--text-muted)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 18px 16px;margin-bottom:14px}
.card-title{font-size:12px;color:var(--text-muted);font-weight:500;margin-bottom:14px;letter-spacing:.02em}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13.5px;gap:12px}
.row:last-child{border-bottom:none}
.row .k{color:var(--text-muted)}
.row .v{color:var(--text);text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500}
.badge-ok{background:rgba(74,222,128,.12);color:var(--success)}
.badge-warn{background:rgba(251,191,36,.12);color:var(--warning)}
.badge-off{background:rgba(248,113,113,.12);color:var(--danger)}
.badge-info{background:rgba(125,211,252,.12);color:var(--accent)}
.bar-wrap{margin-top:12px}
.bar-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:6px}
.bar{height:6px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent);width:0;transition:width .4s ease}
.qr-box{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.qr-frame{padding:12px;border-radius:14px;background:#fff;border:1px solid var(--border)}
.qr-frame img{width:168px;height:168px;display:block;border-radius:6px}
.qr-hint{margin-top:12px;font-size:12.5px;color:var(--text-muted);text-align:center;line-height:1.6}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;text-decoration:none;font-family:inherit}
.btn:hover{border-color:var(--border-hover);background:rgba(255,255,255,.04)}
.btn-primary{background:var(--accent-dim);border-color:rgba(125,211,252,.25);color:var(--accent)}
.btn-primary:hover{background:rgba(125,211,252,.2)}
.btn:disabled{opacity:.55;cursor:not-allowed;animation:none!important;box-shadow:none!important}
.links{margin-top:8px}
.link-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;font-size:12px}
.link-item code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left;color:var(--text-secondary);font-family:ui-monospace,monospace}
.link-item button{flex-shrink:0;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer}
.link-item button:hover{color:var(--accent);border-color:rgba(125,211,252,.3)}
.foot{text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--bg-elevated);border:1px solid var(--border);padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.btn-scan{
  width:100%;padding:14px 16px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;
  font-size:14.5px;font-weight:600;color:#041018;
  background:linear-gradient(135deg,#38bdf8 0%,#818cf8 50%,#c084fc 100%);
  background-size:200% 200%;
  box-shadow:0 0 0 0 rgba(56,189,248,.45),0 8px 28px rgba(99,102,241,.35);
  animation:scanPulse 2.4s ease-in-out infinite, scanShine 4s ease infinite;
  transition:transform .2s,filter .2s;
}
.btn-scan:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-scan:active{transform:scale(.98)}
@keyframes scanPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.4),0 8px 28px rgba(99,102,241,.3)}
  50%{box-shadow:0 0 0 10px rgba(56,189,248,0),0 10px 32px rgba(99,102,241,.45)}
}
@keyframes scanShine{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.scan-status{font-size:12px;color:var(--text-secondary);min-height:0;margin-top:10px;text-align:center}
.scan-status:empty{display:none;margin:0}
.scan-prog{height:4px;background:rgba(255,255,255,.06);border-radius:99px;margin-top:12px;overflow:hidden;opacity:0;transition:opacity .2s}
.scan-prog.on{opacity:1}
.scan-prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#a78bfa);border-radius:99px;transition:width .3s ease}
.scan-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--bg);border:1px solid var(--border);border-radius:12px;margin-top:8px;font-size:12.5px}
.scan-item .rank{flex-shrink:0;width:24px;height:24px;border-radius:8px;background:var(--accent-dim);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600}
.scan-item .meta{flex:1;min-width:0;text-align:right}
.scan-item .meta .ping{font-weight:600;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.scan-item .meta small{display:block;color:var(--text-muted);font-size:11.5px;direction:ltr;margin-top:2px}
.scan-item .acts{display:flex;gap:6px;flex-shrink:0}
.scan-item .acts button{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
  background:rgba(255,255,255,.03);color:var(--text-secondary);cursor:pointer;font-size:14px;
  display:grid;place-items:center;
}
.scan-item .acts button:hover{color:var(--accent);border-color:rgba(125,211,252,.35);background:var(--accent-dim)}
.qr-modal{
  display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);
  align-items:center;justify-content:center;padding:20px;
}
.qr-modal.open{display:flex}
.qr-modal-box{
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:16px;
  padding:18px;text-align:center;max-width:280px;width:100%;
  animation:fadeIn .25s ease;
}
@keyframes fadeIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.qr-modal-box img{width:200px;height:200px;border-radius:10px;background:#fff;padding:8px}
.qr-modal-box p{margin:12px 0 0;font-size:12px;color:var(--text-muted)}
.qr-modal-box button{margin-top:14px;width:100%}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <div class="brand-name">SAOW</div>
        <div class="brand-sub">وضعیت اشتراک</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">اطلاعات حساب</div>
      <div class="row"><span class="k">نام</span><span class="v" id="name">—</span></div>
      <div class="row"><span class="k">وضعیت</span><span class="v" id="statusWrap"><span class="badge badge-info" id="status">—</span></span></div>
      <div class="row"><span class="k">انقضا</span><span class="v" id="expiry">—</span></div>
      <div class="row"><span class="k">IP همزمان</span><span class="v" id="ips">—</span></div>
      <div class="bar-wrap">
        <div class="bar-meta"><span id="usageLabel">مصرف</span><span id="usagePct">۰٪</span></div>
        <div class="bar"><i id="bar"></i></div>
      </div>
    </div>

    <div class="card" id="scanCard">
      <div class="card-title">کانفیگ اختصاصی برای اینترنت شما</div>
      <button type="button" class="btn-scan" id="btnScan">بررسی اینترنت من</button>
      <div class="scan-prog"><i id="scanBar"></i></div>
      <div class="scan-status" id="scanStatus"></div>
      <div id="scanResults"></div>
    </div>

    <div class="card">
      <div class="card-title">اتصال شما</div>
      <div class="row"><span class="k">IP کلاینت</span><span class="v" id="clientIp">—</span></div>
      <div class="row"><span class="k">موقعیت</span><span class="v" id="country">—</span></div>
    </div>

    <div class="card">
      <div class="card-title">QR اشتراک</div>
      <div class="qr-box">
        <div class="qr-frame"><img id="qrImg" alt="QR" width="168" height="168" /></div>
        <p class="qr-hint">اسکن کنید تا لینک ساب به اپ اضافه شود</p>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="btnCopy">کپی لینک ساب</button>
        <a class="btn" id="btnV2ray" href="#">باز کردن v2rayNG</a>
      </div>
      <div class="actions" style="margin-top:10px">
        <a class="btn" id="btnHiddify" href="#">Hiddify</a>
        <a class="btn" id="btnStreisand" href="#">Streisand</a>
      </div>
    </div>

    <div class="card" id="linksCard" style="display:none">
      <div class="card-title">لینک‌های اتصال</div>
      <div class="links" id="linksList"></div>
    </div>

    <p class="foot">Powered by SAOW · <span id="footVer"></span></p>
  </div>

  <div class="qr-modal" id="qrModal">
    <div class="qr-modal-box">
      <img id="qrModalImg" alt="QR" width="200" height="200" />
      <p id="qrModalCap">اسکن با اپ</p>
      <button type="button" class="btn" id="qrModalClose">بستن</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script>
  (function () {
    const DATA = window.__SAOW_SUB__ || {};
    // دیباگ هدرهای درخواست Worker — در DevTools → Console ببینید
    try {
      console.log("%c[SAOW] Request headers / CF fields", "color:#7dd3fc;font-weight:bold");
      console.log(DATA._reqDebug || "(no _reqDebug — mother.js را دیپلوی کنید)");
      console.log("clientIP chosen:", DATA.clientIP);
      console.table(DATA._reqDebug || {});
    } catch (e) {}
    const fa = (n) => String(n ?? "—").replace(/[0-9]/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      clearTimeout(t._x); t._x = setTimeout(() => t.classList.remove("show"), 2200);
    }
    function statusBadge(s) {
      const map = {
        active: ["فعال", "badge-ok"],
        disabled: ["غیرفعال", "badge-off"],
        expired: ["منقضی", "badge-off"],
        "quota-exceeded": ["حجم تمام", "badge-warn"],
        "daily-quota-exceeded": ["روزانه تمام", "badge-warn"],
      };
      const [lab, cls] = map[s] || [s || "—", "badge-info"];
      return { lab, cls };
    }
    document.getElementById("name").textContent = DATA.name || "—";
    const st = statusBadge(DATA.status);
    const stEl = document.getElementById("status");
    stEl.textContent = st.lab;
    stEl.className = "badge " + st.cls;
    document.getElementById("expiry").textContent = DATA.expiryText || "∞";
    document.getElementById("ips").textContent = fa(DATA.activeIPs ?? 0) + " / " + fa(DATA.ipLimit ?? 1);
    document.getElementById("clientIp").textContent = DATA.clientIP || "—";
    const locParts = [DATA.city, DATA.region, DATA.country].filter(Boolean);
    document.getElementById("country").textContent = locParts.length ? locParts.join(" · ") : (DATA.country || "—");
    const usageText = DATA.usageText || "—";
    const quotaText = DATA.quotaText || "∞";
    document.getElementById("usageLabel").textContent = usageText + " از " + quotaText;
    const pct = Math.min(100, Math.max(0, Number(DATA.usagePercent) || 0));
    document.getElementById("usagePct").textContent = fa(Math.round(pct)) + "٪";
    const bar = document.getElementById("bar");
    bar.style.width = pct + "%";
    if (pct >= 90) bar.style.background = "var(--danger)";
    else if (pct >= 70) bar.style.background = "var(--warning)";
    const subUrl = DATA.subUrl || location.href.split("#")[0];
    document.getElementById("qrImg").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=0c0c0e&bgcolor=ffffff&margin=6&data=" +
      encodeURIComponent(subUrl);
    document.getElementById("btnV2ray").href = "v2rayng://install-config?url=" + encodeURIComponent(subUrl);
    document.getElementById("btnHiddify").href = "hiddify://import/" + encodeURIComponent(subUrl);
    document.getElementById("btnStreisand").href = "streisand://import/" + encodeURIComponent(subUrl);
    document.getElementById("btnCopy").addEventListener("click", () => {
      navigator.clipboard.writeText(subUrl).then(() => toast("لینک کپی شد")).catch(() => toast("کپی نشد"));
    });
    if (DATA.version) document.getElementById("footVer").textContent = "v" + DATA.version;
    const links = Array.isArray(DATA.links) ? DATA.links : [];
    if (links.length) {
      document.getElementById("linksCard").style.display = "";
      const list = document.getElementById("linksList");
      list.innerHTML = links.slice(0, 12).map((L, i) => {
        const text = typeof L === "string" ? L : (L.link || L.url || "");
        const label = (typeof L === "object" && L.name) ? L.name : ("پیکربندی " + (i + 1));
        return `<div class="link-item"><span style="color:var(--text-muted);font-size:11px;min-width:4.5rem">${label}</span><code title="${text.replace(/"/g, "&quot;")}">${text.replace(/</g, "")}</code><button type="button" data-link="${encodeURIComponent(text)}" title="کپی">⧉</button></div>`;
      }).join("");
      list.querySelectorAll("button[data-link]").forEach((btn) => {
        btn.addEventListener("click", () => {
          navigator.clipboard.writeText(decodeURIComponent(btn.dataset.link)).then(() => toast("کپی شد"));
        });
      });
    }

    const CF_CIDRS = [
      "104.16.0.0/13","104.24.0.0/14","172.64.0.0/13","162.158.0.0/15",
      "188.114.96.0/20","190.93.240.0/20","197.234.240.0/22","198.41.128.0/17",
      "141.101.64.0/18","103.21.244.0/22","103.22.200.0/22","103.31.4.0/22",
      "108.162.192.0/18","131.0.72.0/22","173.245.48.0/20"
    ];
    const THRESHOLDS = [450, 400, 300, 200, 150];
    const MAX_TRY = 200;
    let scanning = false;

    function parseVless(link) {
      try {
        const s = String(link || "");
        const m = s.match(/^vless:\/\/([^@]+)@([^:]+):(\d+)\?([^#]*)(?:#(.*))?$/i);
        if (!m) return null;
        const qs = new URLSearchParams(m[4] || "");
        return {
          uuid: m[1], address: m[2], port: Number(m[3]) || 443,
          params: qs, remark: decodeURIComponent(m[5] || "SAOW"), raw: s,
        };
      } catch { return null; }
    }

    function buildVlessWithIp(base, ip, rank, latency, limit) {
      const qs = new URLSearchParams(base.params.toString());
      const sni = qs.get("sni") || qs.get("host") || base.address;
      const host = qs.get("host") || sni;
      if (sni && !/^\d+\.\d+\.\d+\.\d+$/.test(sni)) qs.set("sni", sni);
      if (host && !/^\d+\.\d+\.\d+\.\d+$/.test(host)) qs.set("host", host);
      if (!qs.get("encryption")) qs.set("encryption", "none");
      if (!qs.get("security")) qs.set("security", "tls");
      if (!qs.get("fp")) qs.set("fp", "chrome");
      const remark = base.remark + " · ≤" + limit + "ms · " + latency + "ms";
      return "vless://" + base.uuid + "@" + ip + ":" + base.port + "?" + qs.toString() + "#" + encodeURIComponent(remark);
    }

    function cidrToRandomIps(cidr, count) {
      const parts = cidr.split("/");
      const ip = parts[0], mask = parseInt(parts[1], 10);
      const oct = ip.split(".").map(Number);
      const base = ((oct[0] << 24) | (oct[1] << 16) | (oct[2] << 8) | oct[3]) >>> 0;
      const size = Math.pow(2, 32 - mask);
      const out = [], seen = {};
      for (let i = 0; i < count * 5 && out.length < count; i++) {
        let n = (base + Math.floor(Math.random() * size)) >>> 0;
        const last = n & 0xff;
        if (last === 0 || last === 255) n = (n & 0xffffff00) | (1 + Math.floor(Math.random() * 254));
        if (seen[n]) continue;
        seen[n] = 1;
        out.push(((n >>> 24) & 255) + "." + ((n >>> 16) & 255) + "." + ((n >>> 8) & 255) + "." + (n & 255));
      }
      return out;
    }

    function randomPool(n) {
      const pool = [];
      const per = Math.max(4, Math.ceil(n / CF_CIDRS.length));
      for (let c = 0; c < CF_CIDRS.length; c++) pool.push.apply(pool, cidrToRandomIps(CF_CIDRS[c], per));
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
      }
      return pool.slice(0, n);
    }

    async function testIp(ip, timeoutMs) {
      const url = "https://" + ip + ":2096/__down";
      const start = performance.now();
      const controller = new AbortController();
      const tid = setTimeout(function () { controller.abort(); }, timeoutMs);
      let ok = false;
      try {
        await fetch(url, { signal: controller.signal, mode: "no-cors", cache: "no-store" });
        ok = true;
      } catch (e) {
        if (e && e.name !== "AbortError") ok = true;
      }
      clearTimeout(tid);
      return { ip: ip, ok: ok, latency: Math.round(performance.now() - start) };
    }

    function setScanUi(text, pct) {
      document.getElementById("scanStatus").textContent = text || "";
      var prog = document.querySelector(".scan-prog");
      var bar = document.getElementById("scanBar");
      if (pct != null) {
        if (prog) prog.classList.add("on");
        if (bar) bar.style.width = Math.min(100, pct) + "%";
      }
      if (pct === 0 && !text) {
        if (prog) prog.classList.remove("on");
        if (bar) bar.style.width = "0%";
      }
    }

    function openQr(link, label) {
      document.getElementById("qrModalImg").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=220x220&color=0c0c0e&bgcolor=ffffff&margin=8&data=" +
        encodeURIComponent(link);
      document.getElementById("qrModalCap").textContent = label || "اسکن با اپ";
      document.getElementById("qrModal").classList.add("open");
    }
    document.getElementById("qrModalClose").addEventListener("click", function () {
      document.getElementById("qrModal").classList.remove("open");
    });
    document.getElementById("qrModal").addEventListener("click", function (e) {
      if (e.target.id === "qrModal") document.getElementById("qrModal").classList.remove("open");
    });

    function renderFound(found, base) {
      const box = document.getElementById("scanResults");
      // همیشه سریع‌ترین بالا
      const sorted = found.slice().sort(function (a, b) { return a.latency - b.latency; });
      box.innerHTML = sorted.map(function (f, i) {
        const link = buildVlessWithIp(base, f.ip, i + 1, f.latency, f.limit);
        return '<div class="scan-item">' +
          '<span class="rank">' + fa(i + 1) + '</span>' +
          '<div class="meta"><span class="ping">' + fa(f.latency) + ' ms</span><small>' + f.ip + '</small></div>' +
          '<div class="acts">' +
          '<button type="button" class="btn-copy" data-v="' + encodeURIComponent(link) + '" title="کپی">⧉</button>' +
          '<button type="button" class="btn-qr" data-qr="' + encodeURIComponent(link) + '" title="QR کد">QR</button>' +
          '</div></div>';
      }).join("");
      box.querySelectorAll(".btn-copy").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          var t = decodeURIComponent(btn.getAttribute("data-v") || "");
          navigator.clipboard.writeText(t).then(function () { toast("کانفیگ کپی شد"); });
        });
      });
      box.querySelectorAll(".btn-qr").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          var t = decodeURIComponent(btn.getAttribute("data-qr") || "");
          openQr(t, "");
        });
      });
    }

    async function startScan() {
      if (scanning) return;
      const raw = links.length
        ? (typeof links[0] === "string" ? links[0] : (links[0].link || links[0].url || ""))
        : "";
      const base = parseVless(raw);
      if (!base) {
        toast("لینک vless در دسترس نیست");
        setScanUi("ابتدا لینک اتصال از پنل ساخته شود", 0);
        return;
      }
      scanning = true;
      const btn = document.getElementById("btnScan");
      btn.disabled = true;
      btn.textContent = "در حال بررسی…";
      document.getElementById("scanResults").innerHTML = "";
      setScanUi("در حال تست…", 3);

      const pool = randomPool(MAX_TRY);
      const found = [];
      const usedIps = {};
      let poolIdx = 0;
      let tried = 0;

      for (let step = 0; step < THRESHOLDS.length; step++) {
        const limit = THRESHOLDS[step];
        const timeout = Math.min(1400, Math.max(350, limit * 1.5));
        setScanUi("پله " + fa(step + 1) + " · سقف " + fa(limit) + "ms", (step / THRESHOLDS.length) * 100);
        let got = null;
        const CONC = 6;
        while (poolIdx < pool.length && !got) {
          const batch = pool.slice(poolIdx, poolIdx + CONC);
          poolIdx += CONC;
          const results = await Promise.all(batch.map(function (ip) { return testIp(ip, timeout); }));
          tried += batch.length;
          const ok = results
            .filter(function (r) { return r.ok && r.latency <= limit && !usedIps[r.ip]; })
            .sort(function (a, b) { return a.latency - b.latency; });
          if (ok.length) {
            got = { ip: ok[0].ip, latency: ok[0].latency, limit: limit, ok: true };
            usedIps[got.ip] = 1;
          }
          setScanUi(
            "تست‌شده " + fa(tried) + " · پیدا شده " + fa(found.length + (got ? 1 : 0)),
            ((step + (got ? 1 : 0.35)) / THRESHOLDS.length) * 100
          );
        }
        if (got) {
          found.push(got);
          renderFound(found, base);
        } else {
          setScanUi("سقف " + fa(limit) + "ms بدون نتیجه — ادامه", ((step + 1) / THRESHOLDS.length) * 100);
        }
      }

      if (found.length) {
        renderFound(found, base);
        setScanUi(fa(found.length) + " کانفیگ آماده", 100);
        toast(found.length + " کانفیگ آماده شد");
      } else {
        setScanUi("IP مناسبی پیدا نشد — دوباره تلاش کنید", 0);
        toast("نتیجه‌ای نبود");
      }
      btn.disabled = false;
      btn.textContent = "بررسی اینترنت من";
      scanning = false;
    }

    document.getElementById("btnScan").addEventListener("click", startScan);
  })();
  </script>
</body>
</html>
